[workspace]

[package]
name = "embassy-rp2040-w5500"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "HyperDeck client and mock deck for the WIZnet W5500-EVB-Pico"

[[bin]]
name = "mock-deck"
path = "src/bin/mock_deck.rs"

[[bin]]
name = "deck-client"
path = "src/bin/deck_client.rs"

[dependencies]
hyperdeck = { path = "../../crates/hyperdeck", default-features = false, features = ["client", "server", "embassy-time"] }
cortex-m-rt = "0.7"
defmt = "1"
defmt-rtt = "1"
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-net = { version = "0.9", features = ["tcp", "dhcpv4", "medium-ethernet", "proto-ipv4"] }
embassy-net-wiznet = "0.3"
embassy-rp = { version = "0.10", features = ["defmt", "unstable-pac", "time-driver", "critical-section-impl", "rp2040", "executor-thread", "rt"] }
embassy-sync = "0.8"
embassy-time = "0.5"
embedded-hal-bus = { version = "0.1", features = ["async"] }
embedded-io-async = "0.7"
panic-probe = { version = "1", features = ["print-defmt"] }
static_cell = "2"
